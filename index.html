<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Evolutionäre Simulation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #sim { display: block; }
    #info {
      position: absolute;
      top: 0;
      left: 0;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="sim"></canvas>
  <div id="info"></div>
  <button id="toggleBtn" style="position:absolute;top:10px;right:10px;z-index:10;font-size:14px;padding:4px 8px;">Pause</button>
  <div id="tooltip" style="position:absolute;pointer-events:none;background:rgba(0,0,0,0.7);color:#fff;padding:4px 8px;border-radius:4px;font-size:12px;display:none;z-index:1000;"></div>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
