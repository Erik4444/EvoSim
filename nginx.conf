server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Korrekte MIME-Types für ES-Module (type="module") – ohne das blockiert der Browser .js-Dateien
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Haupt-App (SPA-freundlich: unbekannte Pfade → index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets: aggressives Caching für .js-Dateien
    location ~* \.js$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type  "application/javascript; charset=utf-8";
    }

    # Health-Endpoint für Docker/Coolify/Kubernetes
    location /health {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "OK\n";
    }

    # Sicherheits-Header
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Gzip für bessere Performance
    gzip            on;
    gzip_types      text/html application/javascript text/css;
    gzip_min_length 256;
}
