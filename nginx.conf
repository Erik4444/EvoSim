server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Haupt-App – unbekannte Pfade landen auf index.html (SPA-Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Expliziter Content-Type für ES-Module (type="module" braucht application/javascript)
    location ~* \.js$ {
        add_header Content-Type  "application/javascript; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # Health-Endpoint für Docker/Coolify
    location /health {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "OK";
    }

    # Sicherheits-Header
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
