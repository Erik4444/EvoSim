server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Haupt-App
    location / {
        try_files $uri $uri/ =404;
    }

    # Health-Endpoint für Container-Orchestrierung (z. B. Docker, Kubernetes)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
